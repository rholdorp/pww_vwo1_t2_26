<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studieplan – PW maart 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0a0e1a,#111830 50%,#0c1020);font-family:'Nunito',sans-serif;color:#ddd;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:480px;width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:40px 32px;text-align:center}
.icon{font-size:64px;margin-bottom:16px}
h1{font-size:22px;font-weight:800;margin-bottom:8px}
.subtitle{color:#888;font-size:14px;margin-bottom:28px}
.message{background:rgba(255,255,255,0.06);border-radius:10px;padding:20px;margin-bottom:24px;line-height:1.7;font-size:15px;color:#bbb}
.contact{color:#666;font-size:13px}
.btn{display:inline-block;background:rgba(77,150,255,0.15);color:#4d96ff;border:1px solid rgba(77,150,255,0.3);border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:20px;transition:background 0.2s}
.btn:hover{background:rgba(77,150,255,0.25)}
.contact a{color:#4d96ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📋</div>
  <h1>Studieplan Offline</h1>
  <p class="subtitle">Proefwerkweek maart 2026</p>
  <div class="message">
    De proefwerkweek is afgelopen. De database en het trainingsmateriaal zijn offline gehaald.
  </div>
  <a href="dashboard.html" class="btn">Toch doorgaan naar de app</a>
  <p class="contact">Bij vragen, neem contact op met de admin.</p>
</div>
</body>
</html>
