// ===== SPEED ROUND: all sections mixed =====
function genSpeedQs(n=20){
  const allQs=[];
  Object.keys(QUESTIONS).forEach(secId=>{
    (QUESTIONS[secId]||[]).forEach(q=>{
      allQs.push({...q,secId});
    });
  });
  return shuffle(allQs).slice(0,n).map(q=>{
    const opts=shuffle(q.opts);
    return{q:q.q,opts,correct:opts.indexOf(q.a),secId:q.secId};
  });
}

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}

function genQs(secId){
  const pool=QUESTIONS[secId]||[];
  return shuffle(pool).slice(0,10).map(q=>{
    const opts=shuffle(q.opts);
    return{q:q.q,opts,correct:opts.indexOf(q.a)};
  });
}

  if(screen==="diagresult"&&diagTest){

      React.createElement("div",{style:{background:"rgba(0,0,0,0.3)",backdropFilter:"blur(12px)",borderBottom:"1px solid "+bdr,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:50}},

            React.createElement("span",{style:{fontSize:13,fontWeight:800,color:a.ok?"#6bcb77":"#ff6b6b"}},a.ok?"✓ Goed":"✗ Fout"),
            React.createElement("span",{style:{fontSize:11,color:"#666"}},"Vraag "+(i+1))),
          React.createElement("div",{style:{fontSize:13,color:"#ccc",marginBottom:6,lineHeight:1.5}},a.q),
          !a.ok&&React.createElement("div",{style:{fontSize:12,color:"#ff6b6b",marginBottom:4}},"Jouw antwoord: "+a.chosen),
          !a.ok&&React.createElement("div",{style:{fontSize:12,color:"#6bcb77",marginBottom:6}},"Juist: "+a.correct),
          React.createElement("div",{style:{fontSize:12,color:"#999",lineHeight:1.5,fontStyle:"italic",borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:6}},"💡 "+a.explain))),

        // Actions
        React.createElement("div",{style:{display:"flex",gap:8,marginTop:16}},
          React.createElement("button",{style:{flex:1,padding:14,borderRadius:12,border:"none",background:"rgba(255,255,255,0.06)",color:"#ccc",fontSize:14,fontWeight:700},onClick:()=>setScreen("home")},"← Overzicht"),
          React.createElement("button",{style:{flex:1,padding:14,borderRadius:12,border:"none",background:"#E74C3C",color:"#fff",fontSize:14,fontWeight:800},

  }

  return null;
}
